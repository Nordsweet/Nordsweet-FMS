name: Next.js validation

on:
  push:
    branches: [main, develop]
    paths: ['nextjs/**', 'server/**', 'deploy/**', '.github/workflows/nextjs.yml']
  pull_request:
    paths: ['nextjs/**', 'server/**', 'deploy/**', '.github/workflows/nextjs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: nextjs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: python3 -m unittest discover -s ../server -v
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
