name: Deploy develop

# Same mechanism as deploy-prod.yml: Coolify is Tailscale-only, so the runner joins the tailnet and
# calls the Coolify API. COOLIFY_URL and COOLIFY_TOKEN are shared with production; the uuid below
# is the develop resource (dev.fms.lab.vibecde.com), not a secret.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency: deploy-develop

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Trigger Coolify deploy
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_UUID: dhiyvd2qru4y2ika7qjeqoj8
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl -fsS --retry 3 -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_UUID"
