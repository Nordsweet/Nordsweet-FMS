name: fms-dev
# Pre-production (develop) on the homelab: https://dev.fms.lab.vibecde.com (Tailscale only).
services:
  web:
    build: ../nextjs
    depends_on:
      - flight-store
    restart: unless-stopped
    # Bound to the Tailscale IP: Traefik (Coolify, in a container) reaches backends there, and
    # terminates TLS. 127.0.0.1 would be unreachable from the proxy container.
    ports:
      - "100.70.224.81:8020:80"
  flight-store:
    build: ../server
    restart: unless-stopped
    volumes:
      - flight-data:/data

volumes:
  flight-data:
