# OSM tiles cached on disk and shared by every device (OSM tile policy: identify the app, cache >= 7 days).
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:20m max_size=2g inactive=30d use_temp_path=off;

server {
  listen 80;
  root /usr/share/nginx/html;
  # Hashed build assets never change.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~ ^/tiles/(\d+/\d+/\d+\.png)$ {
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    set $osm_path $1;
    proxy_pass https://tile.openstreetmap.org/$osm_path;
    proxy_ssl_server_name on;
    proxy_set_header Host tile.openstreetmap.org;
    proxy_set_header User-Agent "Nordsweet-FMS tile cache (https://github.com/Nordsweet/Nordsweet-FMS)";
    proxy_set_header Cookie "";
    proxy_cache tiles;
    proxy_cache_lock on;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 1m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Tile-Cache $upstream_cache_status;
    add_header Access-Control-Allow-Origin "*";
  }

  # nginx's mime.types lacks .mjs; the MapLibre module worker must be served as JavaScript.
  location ~ \.mjs$ {
    types { application/javascript mjs; }
    add_header Cache-Control "no-cache";
  }

  # Routes are exported as /route.html; pages, data and the service worker must revalidate.
  location / {
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "no-cache";
  }

  error_page 404 /404.html;
}
